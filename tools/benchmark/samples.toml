# SafeRun benchmark samples. Plain text; the runner writes each sample into a fresh temp folder at run time and deletes it afterwards.
# Samples are SIMULATIONS written by the SafeRun authors: nothing here is real malware, and no sample is ever executed (SafeRun is only
# ever called with "scan", never "run"). Exfiltration samples use the loopback placeholder 127.0.0.1:9 or example domains; destructive and
# persistence samples touch only paths under the temp folder.
#
# Fields
#   id        stable identifier
#   kind      code = a single .py file | deps = a requirements.txt | names = package names for "saferun check-names" (SafeRun-only)
#   category  group used for per-category counts
#   label     the expected verdict, frozen before any tool was run: "bad" = should be flagged, "clean" = should not be flagged
#   split     "dev" = may be used while writing and debugging the runner; "held-out" = run once, never used to change anything
#   note      one line on why the sample has its label
#   content   the file text (code and deps) or the list of names (names)
#
# Label meaning: "bad" means the code shows the behaviour of its category (or, for weak_practice and hardcoded_secret, an insecure
# practice) and would be harmful or unsafe with real parameters. These are not all "malware": weak_practice is Bandit's home ground.
# Dependency labels are frozen at the date below; "clean" pins are the latest releases on that date, and a later advisory is reported as
# a flagged exception, not as a silent change.
#
# After the held-out run, SafeRun's rules and settings are NOT tuned to improve scores. Fixes need a new sample set.

[meta]
frozen = "2026-11-03"
description = "SafeRun benchmark sample set, version 1"


