split = "dev"
note = "getattr dispatch limited to a fixed allowlist"
content = '''
import sys

class Commands:
    def cmd_start(self):
        print("start")

    def cmd_stop(self):
        print("stop")

ALLOWED = {"start", "stop"}
name = sys.argv[1]
if name in ALLOWED:
    getattr(Commands(), "cmd_" + name)()
'''

