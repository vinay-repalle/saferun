# SafeRun benchmark samples, set 2 (code samples only). Plain text; the runner writes each sample into a fresh temp folder at run time and
# deletes it afterwards. Samples are SIMULATIONS written by the SafeRun authors: nothing here is real malware, and no sample is ever
# executed (SafeRun is only ever called with "scan", never "run"). Exfiltration samples use the loopback placeholder 127.0.0.1:9 or
# *.invalid domains; destructive and persistence samples touch only paths under the temp folder or stand-in names. Fake secrets are
# obviously fake.
#
# Why a second set: every sample in samples.toml (set 1) has been seen, and its misses are known, so set 1 is now DEV MATERIAL ONLY.
# Rule changes may use set 1 and the "dev" samples of this file. The "held-out" samples of this file are run twice at most: once with
# the unchanged rules (baseline, committed first) and once after the rule changes. They are never used to change anything.
#
# Bias caveat: set 2 was written by the same authors who already knew where set 1 was missed, so the new samples can be unconsciously
# easier or harder than a stranger's. To reduce this the samples are structurally different from set 1 (other libraries, pathlib,
# functions and classes, other ways to build the same behaviour), but the bias is reduced, not removed. This is not an independent
# evaluation.
#
# Scope: code samples only. Dependency pins age with the advisory data and look-alike names have no new misses to fix, so set 1's
# dependency and name results stay as published. Bandit is re-run on this set; pip-audit has nothing to read here.
#
# Fields: same as samples.toml (id, kind, category, label, split, note, content).
#   label "bad" = should be flagged, "clean" = should not be flagged (frozen before any tool ran on this set).
#   split "dev" = may be used while writing rules; "held-out" = baseline once, final once, never used to change anything.
#
# Known false alarms are NOT to be fixed: os.system("clear") (set 1 hn-01) and MD5 as a cache key (set 1 hn-06) are reported as known
# false alarms. This file adds no sample that depends on either.

[meta]
frozen = "2026-11-03"
description = "SafeRun benchmark sample set, version 2 (code only)"


