[[sample]]
id = "x2-hn-11"
kind = "code"
category = "hard_negative"
label = "clean"
split = "held-out"
note = "rotates the app's own old backups"
content = '''
import os
import time

BACKUPS = "backups"
cutoff = time.time() - 30 * 86400
for name in os.listdir(BACKUPS):
    path = os.path.join(BACKUPS, name)
    if name.endswith(".bak") and os.path.getmtime(path) < cutoff:
        os.remove(path)
'''

