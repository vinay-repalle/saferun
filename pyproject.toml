[build-system]
requires = ["setuptools>=77"]      # >=77: SPDX `license` expression and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "saferun"
version = "0.0.1"
description = "Secure verification of AI-generated code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/vinay-repalle/saferun"
Issues = "https://github.com/vinay-repalle/saferun/issues"

[project.scripts]
saferun = "saferun.cli:main"
saferun-web = "saferun.api.server:main"   # local dashboard; needs the `web` extra

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "ruamel.yaml>=0.18", "build>=1.2"]   # httpx: FastAPI/Starlette TestClient; ruamel.yaml: validates the release workflow YAML in tests; build: wheel/sdist check
web = ["fastapi>=0.115,<0.141", "uvicorn"]   # upper bound = the range tested; it was originally forced by a conflict with a host-installed Semgrep, which SafeRun no longer uses
# no "analysis" extra: Semgrep and OSV-Scanner run only inside the analyzer container (docker/analyzer/build.sh), never from the host environment

# Supported installation is from a source checkout (`pip install -e .`): the analyzer build recipe (docker/) and the dashboard build (web/dist) live
# outside the `saferun` package and are not included in the wheel. See docs/install-and-test.md.
[tool.setuptools.packages.find]
include = ["saferun*"]

[tool.setuptools.package-data]
saferun = ["engine/rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the sandbox image"]
