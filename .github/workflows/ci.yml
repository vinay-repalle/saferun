# Continuous integration: tests and checks only. This workflow never publishes anything, never logs in to a registry, has no secrets and only
# read access to the repository. Publishing the analyzer image is a separate, tag-triggered workflow (release-analyzer.yml).
#
# Jobs marked "advisory" use continue-on-error: they report problems without blocking a merge, because they depend on the runner's Docker
# daemon or on third-party advisory databases. Every action is pinned to a full commit SHA.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (Docker tests excluded)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SafeRun with the dev extra
        run: python -m pip install -e '.[dev]'

      - name: Syntax check of all Python sources and the shell build script
        run: |
          python -m compileall -q saferun tests docker/analyzer/fetch_verified.py docker/analyzer/build.py
          sh -n docker/analyzer/build.sh

      - name: Run the tests that do not need Docker
        # Docker-dependent tests are covered by the separate (advisory) docker job. They are deselected here, not hidden: see the header line.
        run: python -m pytest -q -ra -m "not docker"

  platforms:
    name: Python tests on ${{ matrix.os }} (Docker tests excluded)
    # Native macOS and Windows runs of everything that does not need a Linux Docker daemon. GitHub's macOS and Windows runners cannot run the
    # Linux sandbox containers, so Docker integration is verified on Linux only (the docker job below); see docs/platforms.md.
    # The Intel macOS leg is advisory: GitHub may retire that runner image.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            experimental: false
          - os: macos-15
            experimental: false
          - os: macos-15-intel
            experimental: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SafeRun with the dev extra
        run: python -m pip install -e ".[dev]"

      - name: Platform and Docker diagnostics (informational)
        shell: bash
        run: |
          python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
          docker version || echo "docker: not usable on this runner"
          docker info --format 'daemon OSType: {{.OSType}}' || echo "docker daemon: not reachable (expected on this runner)"

      - name: Run the tests that do not need Docker
        run: python -m pytest -q -ra -m "not docker"

      - name: State what was not verified
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo "Docker sandbox and analyzer integration tests were NOT run on this platform (no Linux Docker daemon on the runner)."
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Website tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile without running install scripts
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  package:
    name: Build and inspect the wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install 'build>=1.2' 'twine>=5'
          python -m build
          python -m twine check dist/*

      - name: Check the contents of both distributions
        run: |
          set -eu
          wheel=$(ls dist/*.whl)
          python -m zipfile -l "$wheel" | grep -q 'saferun/engine/rules/python.yml'
          python -m zipfile -l "$wheel" | grep -q 'saferun/cli.py'
          python -m zipfile -l "$wheel" | grep -q 'saferun/doctor.py'
          for bad in 'docker/' 'tests/' 'web/' 'node_modules' '\.venv'; do
            if python -m zipfile -l "$wheel" | grep -q "$bad"; then echo "wheel contains $bad" >&2; exit 1; fi
          done
          tar tzf dist/*.tar.gz | grep -q 'docker/analyzer/Dockerfile'
          tar tzf dist/*.tar.gz | grep -q 'web/package-lock.json'
          if tar tzf dist/*.tar.gz | grep -q 'node_modules/'; then echo "sdist contains node_modules" >&2; exit 1; fi

      - name: Install the wheel into a clean virtual environment and run the CLI away from the checkout
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/saferun" --help > /dev/null
          "$RUNNER_TEMP/clean/bin/saferun" --version
          # doctor exits 1 on a runner without Docker/analyzer, which is expected; it must still run and print its checks
          "$RUNNER_TEMP/clean/bin/saferun" doctor --format json | python -c "import json,sys; d=json.load(sys.stdin); assert d['checks']"
          "$RUNNER_TEMP/clean/bin/python" -c "import saferun.engine.semgrep as s; assert s.RULES_FILE.is_file(), s.RULES_FILE"

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: npm audit of the website's production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high


  docker:
    name: Sandbox and analyzer tests with Docker (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SafeRun
        run: python -m pip install -e '.[dev]'

      - name: Print the runner's Docker and cgroup environment (diagnostic only)
        # Read-only. Helps explain runner-specific differences, e.g. whether Docker reports OOMKilled for a killed container.
        run: |
          docker version
          docker info
          stat -fc %T /sys/fs/cgroup
          uname -r

      - name: Pull the pinned sandbox images and build the analyzer locally
        # SafeRun pulls by pinned digest and verifies it; the analyzer is built from docker/analyzer (no signed release is used or needed).
        run: saferun init --only python,node,analyzer --build-local

      - name: Run the Docker-dependent tests
        run: python -m pytest -q -ra -m docker
