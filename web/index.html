<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f2f1ed" />
    <!-- Title and description below are for the dev server only: npm run build replaces them per page (src/seo.js). -->
    <title>SafeRun: check code before you run it</title>
    <meta name="description" content="SafeRun checks untrusted Python code before you run it." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 64'%3E%3Cpath fill-rule='evenodd' fill='%2318181b' d='M28 3 6 11v21c0 14 10 24 22 29 12-5 22-15 22-29V11L28 3ZM21 21.500v21l19-10.500-19-10.500Z'/%3E%3C/svg%3E" />
    <!-- Without JavaScript the pre-rendered page shows its finished state: the hero not pinned, every section visible. -->
    <noscript><style>
      html .sh.sh-live { --p1: 1; --p2: 1; --p3: 1; height: auto; }
      html .sh-live .sh-pin { position: relative; top: auto; height: auto; padding: 72px 0 56px; display: block; }
      html .sh-live .sh-intro { display: none; }
      html .sh-live .sh-copy { pointer-events: auto; }
      html .reveal, html .reveal .stag > * { opacity: 1; transform: none; }
    </style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
